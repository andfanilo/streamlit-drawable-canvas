repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: \.py$|\.pyi$
      - id: ruff-format
        files: \.py$|\.pyi$

  # STAGE 2: re-add a format-ts-js (prettier --check) hook once frontend/src is
  # rewritten -- the v1 source was never prettier-formatted.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)
          ^streamlit_drawable_canvas/frontend/build/
      - id: check-added-large-files
        args: ["--maxkb=3072"]
        exclude: |
          (?x)
          ^streamlit_drawable_canvas/frontend/build/
