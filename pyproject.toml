[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-drawable-canvas"
version = "0.10.0"
description = "A Streamlit custom component for a free drawing canvas using Fabric.js."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fanilo Andrianasolo", email = "contact@andfanilo.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["streamlit >= 1.53"]

[project.urls]
Homepage = "https://github.com/andfanilo/streamlit-drawable-canvas"
"Source Code" = "https://github.com/andfanilo/streamlit-drawable-canvas"
"Bug Tracker" = "https://github.com/andfanilo/streamlit-drawable-canvas/issues"

[project.optional-dependencies]
image = ["Pillow", "numpy"]

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "ruff>=0.8.0",
  "pytest>=7.4,<10",
  "wheel",
]
e2e = [
  "playwright>=1.48,<2",
  "pytest-playwright>=0.3.3",
  "pytest-xdist",
  "Pillow",
  "requests",
]

[tool.ruff]
# ruff formats Python code blocks inside Markdown. FAQ.md aligns its sample
# code deliberately, so keep both the linter and the formatter out of docs.
extend-exclude = ["*.md"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools.packages.find]
include = ["streamlit_drawable_canvas*"]
# Keep find_packages semantics: without this, the pyproject.toml default
# (namespaces = true) discovers every node_modules dir as a namespace package
# and ships stray .py files in the wheel.
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
streamlit_drawable_canvas = ["frontend/build/**/*", "pyproject.toml"]
